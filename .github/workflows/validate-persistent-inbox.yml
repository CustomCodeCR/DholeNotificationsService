name: Validate Persistent Notification Inbox

on:
  push:
    branches: [feature/persistent-topbar-notifications-20260828]

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Test and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e GITHUB_ACTOR="$GITHUB_ACTOR" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -v "$PWD:/src" -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 bash -lc '
              set -euo pipefail
              export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
              dotnet restore tests/Dhole.Notifications.UnitTests/Dhole.Notifications.UnitTests.csproj --configfile NuGet.Config
              dotnet test tests/Dhole.Notifications.UnitTests/Dhole.Notifications.UnitTests.csproj --no-restore --configuration Release
              dotnet restore src/Dhole.Notifications.Api/Dhole.Notifications.Api.csproj --configfile NuGet.Config
              dotnet build src/Dhole.Notifications.Api/Dhole.Notifications.Api.csproj --no-restore --configuration Release
            '
      - name: Build API and Worker images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Notifications.Api/Dockerfile -t dhole/notifications-inbox-api-validation .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Notifications.Workers/Dockerfile -t dhole/notifications-inbox-worker-validation .
