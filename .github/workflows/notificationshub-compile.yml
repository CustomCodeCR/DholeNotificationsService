name: NotificationsHub pilot - compile candidate only
# Rebuild after Redis callback name collision fix.
on:
  push:
    branches: [feature/rt-notificationshub-20261109-01]
    paths: [.github/workflows/notificationshub-compile.yml]
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Authenticate NuGet package feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget update source github --username github-actions --password "$GITHUB_TOKEN" --store-password-in-clear-text --configfile NuGet.Config
      - name: Check SemVer and release notes
        run: python3 scripts/verify_dhole_version.py
      - name: Restore Notifications API
        run: dotnet restore src/Dhole.Notifications.Api/Dhole.Notifications.Api.csproj --configfile NuGet.Config
      - name: Compile NotificationsHub host
        run: dotnet build src/Dhole.Notifications.Api/Dhole.Notifications.Api.csproj --no-restore -c Release
