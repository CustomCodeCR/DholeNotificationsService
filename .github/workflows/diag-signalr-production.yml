name: Diagnose production SignalR

on:
  push:
    branches: [diag-signalr-production]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Confirm seller request realtime delivery
        shell: bash
        run: |
          set +e
          echo '=== PRICING WORKER ==='
          docker inspect --format='state={{.State.Status}} restartCount={{.RestartCount}} started={{.State.StartedAt}}' dhole-pricing-workers-1 2>&1 || true
          docker logs --since 10m --tail 300 dhole-pricing-workers-1 2>&1 | grep -Ei 'Outbox processed|failed|exception|rate-request|notification' | tail -n 150 || true

          echo '=== NOTIFICATION TYPE COUNTS ==='
          docker exec postgres sh -lc 'psql -U "${POSTGRES_USER:-postgres}" -d dhole_notifications -Atc "select notification_type, count(*) from notifications.notification_messages group by notification_type order by notification_type;"' 2>&1 || true

          echo '=== DELIVERY ATTEMPT STATUS COUNTS ==='
          docker exec postgres sh -lc 'psql -U "${POSTGRES_USER:-postgres}" -d dhole_notifications -Atc "select status, count(*) from notifications.notification_delivery_attempts group by status order by status;"' 2>&1 || true

          echo '=== PRICING OUTBOX STATUS COUNTS ==='
          docker exec postgres sh -lc 'psql -U "${POSTGRES_USER:-postgres}" -d dhole_pricing -Atc "select status, count(*) from pricing.outbox_messages group by status order by status;"' 2>&1 || true

          echo '=== SIGNALR TRANSPORT ==='
          docker exec redis redis-cli PUBSUB NUMSUB dhole.notifications.signalr 2>&1 || true
          docker exec redis redis-cli XINFO GROUPS dhole.notifications.events 2>&1 || true
          docker logs --since 2h --tail 1800 dhole-api-gateway-1 2>&1 | grep -Ei 'Gateway forwarding WebSocket /api/notifications/hub|POST /api/notifications/hub/negotiate (200|401)' | tail -n 80 || true
