name: Deploy Dhole Notifications - Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: dhole-notifications-staging
  cancel-in-progress: false
env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  COMPOSE_OVERRIDE: .dhole-system/deploy/docker-compose.staging.yml
  DHOLE_IMAGE_TAG: staging
  DHOLE_NETWORK: dhole-staging
  COMPOSE_PROJECT: dhole-staging
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Load Dhole deployment infrastructure
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.staging" >> "$GITHUB_ENV"
      - name: Verify staging server
        run: docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" config -q
      - name: Test notification duplicate-send safeguards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            -e HOME=/tmp \
            -e DOTNET_CLI_HOME=/tmp \
            -e GITHUB_ACTOR="$GITHUB_ACTOR" \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            bash -lc '
              set -euo pipefail
              export NuGetPackageSourceCredentials_github="Username=$GITHUB_ACTOR;Password=$GITHUB_TOKEN;ValidAuthenticationTypes=Basic"
              dotnet restore tests/Dhole.Notifications.UnitTests/Dhole.Notifications.UnitTests.csproj --configfile /src/NuGet.Config
              dotnet test tests/Dhole.Notifications.UnitTests/Dhole.Notifications.UnitTests.csproj --no-restore -c Release --verbosity minimal
            '
      - name: Build images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Notifications.Api/Dockerfile -t dhole/notifications-api:staging -t "dhole/notifications-api:staging-$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Notifications.Workers/Dockerfile -t dhole/notifications-workers:staging -t "dhole/notifications-workers:staging-$SHA_TAG" .
      - name: Deploy Notifications staging
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never notifications-api notifications-workers
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" ps notifications-api notifications-workers
      - name: Cleanup old images
        run: docker image prune -f
