name: Dhole Notifications CI

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget update source github
          --username "$GITHUB_ACTOR"
          --password "$GITHUB_TOKEN"
          --store-password-in-clear-text
          --configfile NuGet.Config

      - name: Restore
        run: dotnet restore DholeNotificationsService.slnx --configfile NuGet.Config

      - name: Build
        run: dotnet build DholeNotificationsService.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DholeNotificationsService.slnx --configuration Release --no-build --verbosity normal
