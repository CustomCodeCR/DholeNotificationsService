name: Verify Notifications master release build and tests
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.targets'
      - 'version.json'
      - '.github/workflows/ci-release-version-notices-master.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Authenticate GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dotnet nuget update source github
          --username "$GITHUB_ACTOR"
          --password "$GITHUB_TOKEN"
          --store-password-in-clear-text
          --configfile NuGet.Config
      - name: Restore
        run: dotnet restore DholeNotificationsService.slnx --configfile NuGet.Config
      - name: Compile
        run: dotnet build DholeNotificationsService.slnx -c Release --no-restore
      - name: Tests
        run: dotnet test DholeNotificationsService.slnx -c Release --no-build
